<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>KIDS-BIZ | 아동복 온/오프라인 통합 재고 및 매출 관리</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile Browser Chrome & Theme Colors -->
    <meta name="theme-color" content="#5a4336" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari Standalone (주소창 & 하단 툴바 숨김 독립 실행) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KIDS-BIZ" />

    <!-- Windows / MS Tiles -->
    <meta name="application-name" content="KIDS-BIZ" />
    <meta name="msapplication-TileColor" content="#5a4336" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />
    <meta name="msapplication-navbutton-color" content="#5a4336" />

    <!-- Mobile Formatting Ergonomics -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  </head>
  <body class="bg-[#f8f9fa] text-slate-800 antialiased selection:bg-brand-200 selection:text-brand-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            },
            (err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
